<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0e14">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    :root { color-scheme: dark; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0e14;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body { position: fixed; inset: 0; }

    #unity-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0b0e14;
      touch-action: none;
      outline: none;
    }

    #unity-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #b7c0cf;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: #0b0e14;
      transition: opacity 0.3s ease;
    }

    #unity-progress-track {
      width: min(240px, 60vw);
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    #unity-progress-fill {
      width: 0%;
      height: 100%;
      background: #207832;
      transition: width 0.15s linear;
    }

    #unity-error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #ff8080;
      font-size: 14px;
      line-height: 1.6;
      background: #0b0e14;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">
      <div>{{{ PRODUCT_NAME }}}</div>
      <div id="unity-progress-track"><div id="unity-progress-fill"></div></div>
    </div>
    <div id="unity-error"></div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var progress = document.querySelector("#unity-progress-fill");
    var errorBox = document.querySelector("#unity-error");

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: function (message, type) {
        if (type === "error") showError(message);
      }
    };

    function showError(message) {
      errorBox.style.display = "flex";
      errorBox.textContent = message;
      loading.style.display = "none";
    }

    // Browser-Gesten, die beim Spielen stören: Kontextmenü, Doppeltipp-Zoom, Pull-to-Refresh.
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    window.addEventListener("keydown", function (e) {
      // Pfeiltasten und Leertaste gehören dem Spiel, nicht dem Scrollen der Seite.
      if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) !== -1) e.preventDefault();
    }, { passive: false });

    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onerror = function () { showError("Could not load the game files."); };
    script.onload = function () {
      createUnityInstance(canvas, config, function (value) {
        progress.style.width = (100 * value) + "%";
      }).then(function () {
        loading.style.opacity = "0";
        setTimeout(function () { loading.style.display = "none"; }, 300);
        canvas.focus();
      }).catch(function (message) {
        showError(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
